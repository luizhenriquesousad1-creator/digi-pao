<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>DigiPão | Cadastro</title>

</head>

<body>

    <header>

        <h1>DigiPão</h1>

        <p>Crie sua conta</p>

    </header>

    <main>

        <h2>Cadastro de cliente</h2>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Cadastrar</button>

        </form>

        <a href="{% url 'catalog:product_list' %}">

            Voltar ao catálogo

        </a>

    </main>

</body>

</html>
